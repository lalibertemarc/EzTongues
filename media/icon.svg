<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#43226a"/>
      <stop offset="0.6" stop-color="#22113c"/>
      <stop offset="1" stop-color="#110820"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e5b94c"/>
      <stop offset="1" stop-color="#8f5f17"/>
    </linearGradient>
    <linearGradient id="rune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.5" stop-color="#7fd8f0"/>
      <stop offset="1" stop-color="#2f86b0"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2a72"/>
      <stop offset="1" stop-color="#1f0f33"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="0.6" stop-color="#f3e6c4"/>
      <stop offset="1" stop-color="#c9b48a"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fd8f0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7fd8f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd36b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- runes, each in a 28 x 40 box: the line in its tongue -->
    <path id="r1" d="M6,40 V0 M6,9 L24,0 M6,21 L24,12"/>
    <path id="r2" d="M14,40 V0 M14,19 L2,5 M14,19 L26,5"/>
    <path id="r3" d="M14,1 L26,15 L14,28 L2,15 Z M14,28 L4,40 M14,28 L24,40"/>
    <path id="r4" d="M6,40 V0 M6,9 L22,20 L6,31"/>
    <path id="r5" d="M3,5 H25 L9,21 L25,37"/>
    <path id="r6" d="M2,32 L10,8 L18,32 L26,8"/>
    <path id="tick" d="M8,0 L2,14"/>
    <g id="line1">
      <use xlink:href="#r1" x="80" y="80"/><use xlink:href="#r5" x="120" y="80"/>
      <use xlink:href="#tick" x="160" y="80"/>
      <use xlink:href="#r3" x="182" y="80"/><use xlink:href="#r2" x="222" y="80"/>
    </g>
    <g id="line2">
      <use xlink:href="#r6" x="80" y="140"/><use xlink:href="#r4" x="120" y="140"/>
      <use xlink:href="#r2" x="158" y="140"/><use xlink:href="#r1" x="198" y="140"/>
      <use xlink:href="#r5" x="234" y="140"/>
    </g>
    <!-- a hooded figure, cloak's base at the origin -->
    <g id="bust">
      <path d="M-28,0 C-28,-30 -18,-44 0,-44 C18,-44 28,-30 28,0 Z"/>
      <circle cx="0" cy="-62" r="15"/>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#fff6d0" opacity="0.8">
    <circle cx="30" cy="30" r="1.6"/><circle cx="378" cy="58" r="1.8"/><circle cx="200" cy="20" r="1.4"/>
    <circle cx="210" cy="384" r="1.4"/><circle cx="20" cy="226" r="1.8"/><circle cx="384" cy="210" r="1.4"/>
  </g>

  <!-- soft glow behind the runes -->
  <ellipse cx="172" cy="134" rx="170" ry="112" fill="url(#aura)"/>

  <!-- the speaker's bubble, in the tongue -->
  <path d="M96,48 H260 Q312,48 312,100 V168 Q312,220 260,220 H150 L100,282 L112,220 H96 Q44,220 44,168 V100 Q44,48 96,48 Z"
        fill="url(#bubble)" stroke="#3a2306" stroke-width="13" stroke-linejoin="round"/>
  <path d="M96,48 H260 Q312,48 312,100 V168 Q312,220 260,220 H150 L100,282 L112,220 H96 Q44,220 44,168 V100 Q44,48 96,48 Z"
        fill="none" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#0d2a3a" stroke-width="13"><use xlink:href="#line1" x="12"/><use xlink:href="#line2" x="12"/></g>
    <g stroke="url(#rune)" stroke-width="6" filter="url(#glow)"><use xlink:href="#line1" x="12"/><use xlink:href="#line2" x="12"/></g>
  </g>

  <!-- the meaning drifting over to the one who knows it -->
  <g fill="#7fd8f0" filter="url(#glow)">
    <circle cx="326" cy="132" r="4"/><circle cx="342" cy="158" r="5"/><circle cx="350" cy="188" r="6"/>
  </g>

  <!-- the listener's bubble: plain words -->
  <path d="M206,232 H338 Q370,232 370,264 V282 Q370,314 338,314 H322 L316,342 L300,314 H206 Q174,314 174,282 V264 Q174,232 206,232 Z"
        fill="url(#parch)" stroke="#3a2306" stroke-width="11" stroke-linejoin="round"/>
  <path d="M206,232 H338 Q370,232 370,264 V282 Q370,314 338,314 H322 L316,342 L300,314 H206 Q174,314 174,282 V264 Q174,232 206,232 Z"
        fill="none" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#8a7550" stroke-width="9" stroke-linecap="round">
    <path d="M198,258 H346"/><path d="M198,280 H330"/><path d="M198,300 H280"/>
  </g>

  <!-- speaker and listener -->
  <ellipse cx="96" cy="398" rx="90" ry="18" fill="url(#pool)"/>
  <ellipse cx="326" cy="398" rx="70" ry="14" fill="url(#pool)"/>
  <g stroke="#3a2306" stroke-width="2.8" stroke-linejoin="round" fill="url(#gold)">
    <use xlink:href="#bust" transform="translate(96,404) scale(1.35)"/>
    <use xlink:href="#bust" transform="translate(326,404) scale(0.95)"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff6d0">
    <path d="M362,24 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z"/>
    <path d="M22,92 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 z"/>
    <path d="M206,340 l2.5,7.5 l7.5,2.5 l-7.5,2.5 l-2.5,7.5 l-2.5,-7.5 l-7.5,-2.5 l7.5,-2.5 z"/>
  </g>
</svg>
